[project]
name = "checkmarks"
version = "0.3.0"
description = "Progress dashboard for Markdown checklists"
authors = [
  { name = "menisadi", email = "menisadi@gmail.com" }
]

readme = "README.md"

license = "MIT"
license-files = ["LICENSE"]

keywords = ["cli", "markdown", "checklists"]

requires-python = ">=3.11"

dependencies = []

[project.scripts]
checkmarks = "checkmarks.cli:main"

[project.urls]
"Homepage" = "https://github.com/menisadi/checkmarks"
"Issues" = "https://github.com/menisadi/checkmarks/issues"

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
